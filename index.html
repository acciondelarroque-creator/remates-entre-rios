<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remates en Entre Ríos</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:42px;overflow:hidden}body{font-family:Arial,sans-serif;background:#111}.marquesina{position:relative;width:100%;height:42px;overflow:hidden;white-space:nowrap;background:#111;color:#fff}.fija{position:absolute;z-index:10;left:0;top:0;width:100px;height:42px;display:flex;align-items:center;justify-content:flex-start;padding:0 8px;background:#4b141e;border-right:1px solid rgba(255,255,255,.4);box-shadow:7px 0 12px rgba(0,0,0,.34)}.fija strong{font-size:13px;line-height:1;font-weight:700;color:#fff;text-align:left}.zona{position:absolute;left:100px;right:0;top:0;height:42px;overflow:hidden;background:#6b1f2b}.scroll{position:absolute;left:0;top:0;width:100%;height:42px;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;padding-left:28px;cursor:grab;user-select:none}.scroll::-webkit-scrollbar{display:none}.scroll.grabbing{cursor:grabbing}.item{display:inline-flex;align-items:center;gap:6px;height:42px;flex:0 0 auto;padding:0 14px;border-right:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:400}.item .fecha,.item .lugar{font-weight:700}.item .cons{font-size:13px}.flecha{position:absolute;z-index:20;top:0;width:34px;height:42px;display:none;align-items:center;justify-content:center;color:#fff;border:0;padding:0;background:transparent;pointer-events:auto;cursor:pointer}.flecha.izq{left:0}.flecha.der{right:0}.flecha span{display:block;width:10px;height:10px;border-top:2px solid #fff;border-right:2px solid #fff}.izq span{transform:rotate(-135deg)}.der span{transform:rotate(45deg)}@media(max-width:600px){.fija{width:80px;padding:0 9px}.fija strong{font-size:12px;line-height:13px}.zona{left:80px}.scroll{padding-left:14px}.item{padding:0 8px;font-size:11px;gap:4px}.item .cons{font-size:11px}.flecha{width:30px}}</style></head><body><div class="marquesina"><div class="fija"><strong>Remates en<br>Entre Ríos</strong></div><div class="zona"><button id="izq" class="flecha izq" aria-label="Anterior"><span></span></button><div id="scroll" class="scroll"><div class="item">Cargando remates…</div></div><button id="der" class="flecha der" aria-label="Siguiente"><span></span></button></div></div><script>const JSON_URL='https://raw.githubusercontent.com/acciondelarroque-creator/remates-entre-rios/main/remates.json',MESES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'],scroll=document.getElementById('scroll'),izq=document.getElementById('izq'),der=document.getElementById('der');function ordenar(a){return[...a].sort((x,y)=>(x.fecha||'').localeCompare(y.fecha||'')||(x.hora||'').localeCompare(y.hora||'')||(x.localidad||'').localeCompare(y.localidad||'','es'))}function fecha(r){const d=new Date((r.fecha||'')+'T00:00');return Number.isNaN(d.getTime())?r.fecha||'':`${String(d.getDate()).padStart(2,'0')} ${MESES[d.getMonth()]}`}function abreviar(s){return(s||'').trim().replace(/\bGENERAL\b/gi,'GRAL.').replace(/\bCONSIGNATARIA\b/gi,'CONSIG.').replace(/\bCOOPERATIVA\b/gi,'COOP.').replace(/\bSOCIEDAD RURAL\b/gi,'SOC. RURAL').replace(/\s{2,}/g,' ').trim()}function lugar(r){const l=(r.localidad||'').trim();if(/^FERIA MAR[IÍ]A DOLORES\s*[–-]\s*GENERAL RAM[IÍ]REZ$/i.test(l))return'FMD - GRAL. RAMÍREZ';return abreviar(l)||'SIN LOCALIDAD'}function cons(r){return abreviar(r.consignataria)||'SIN CONSIG.'}function flechas(){const max=scroll.scrollWidth-scroll.clientWidth,ok=max>2;izq.style.display=ok?'flex':'none';der.style.display=ok?'flex':'none'}function mover(d){const max=scroll.scrollWidth-scroll.clientWidth,paso=Math.max(220,scroll.clientWidth*.65),dest=Math.max(0,Math.min(max,scroll.scrollLeft+d*paso));scroll.scrollTo({left:dest,behavior:'smooth'});pausarHasta=Date.now()+2500;setTimeout(flechas,500)}izq.onclick=()=>mover(-1);der.onclick=()=>mover(1);let arr=false,sx=0,ss=0,pausarHasta=Date.now()+1200,autoDir=1,lastAuto=performance.now();scroll.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;arr=true;sx=e.clientX;ss=scroll.scrollLeft;pausarHasta=Date.now()+2500;scroll.classList.add('grabbing')});window.addEventListener('pointermove',e=>{if(!arr)return;scroll.scrollLeft=ss-(e.clientX-sx);e.preventDefault()});window.addEventListener('pointerup',()=>{arr=false;scroll.classList.remove('grabbing');pausarHasta=Date.now()+1200});function auto(t){const dt=Math.min(100,t-lastAuto);lastAuto=t;if(!arr&&Date.now()>=pausarHasta){const max=scroll.scrollWidth-scroll.clientWidth;if(max>2){let n=scroll.scrollLeft+0.55*(dt/16.67)*autoDir;if(n>=max){n=max;autoDir=-1}if(n<=0){n=0;autoDir=1}scroll.scrollLeft=n}}requestAnimationFrame(auto)}requestAnimationFrame(auto);async function cargar(){try{const r=await fetch(JSON_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json(),rs=ordenar(d.remates||[]);scroll.innerHTML=rs.length?rs.map(r=>`<div class="item"><span class="fecha">${fecha(r)}</span><span class="lugar">${lugar(r)}</span><span class="cons">${cons(r)}</span></div>`).join(''):'<div class="item">Sin fechas de remates</div>';requestAnimationFrame(flechas)}catch(e){scroll.innerHTML='<div class="item">No se pudieron cargar los remates</div>';flechas()}}scroll.addEventListener('scroll',flechas,{passive:true});window.addEventListener('resize',flechas);cargar();setInterval(cargar,300000);</script></body></html>

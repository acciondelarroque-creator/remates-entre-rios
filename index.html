<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Remates en Entre Ríos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:40px;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;background:#111}
.marquesina{position:relative;width:100%;height:40px;overflow:hidden;white-space:nowrap;background:#111;color:#fff}
.fija{position:absolute;z-index:10;left:0;top:0;width:150px;height:40px;display:flex;align-items:center;padding:0 9px;background:#6b1f2b;border-right:1px solid rgba(255,255,255,.35);box-shadow:7px 0 12px rgba(0,0,0,.28)}
.fija strong{display:flex;flex-direction:column;justify-content:center;line-height:1;font-size:15px;letter-spacing:.15px;color:#fff}
.zona{position:absolute;left:150px;right:0;top:0;height:40px;overflow:hidden;background:#6b1f2b}
.scroll{position:absolute;left:0;top:0;width:100%;height:40px;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding-left:22px;cursor:grab;user-select:none;-webkit-user-select:none}
.scroll.grabbing{cursor:grabbing}
.scroll::-webkit-scrollbar{display:none}
.item{display:inline-flex;align-items:center;gap:7px;height:40px;flex:0 0 auto;padding:0 20px;border-right:1px solid rgba(255,255,255,.28);color:#fff;font-size:14px;font-weight:600}
.item .fecha{font-weight:800;color:#fff}.item .lugar{font-weight:700;text-transform:uppercase;color:#fff}.item .cons{font-size:11px;color:#f0dfe2}
.flecha{position:absolute;z-index:20;top:0;width:38px;height:40px;display:none;align-items:center;justify-content:center;color:#fff;pointer-events:auto;cursor:pointer}
.flecha.izq{left:0;background:linear-gradient(to right,#6b1f2b,rgba(107,31,43,.92),rgba(107,31,43,0))}
.flecha.der{right:0;background:linear-gradient(to left,#6b1f2b,rgba(107,31,43,.92),rgba(107,31,43,0))}
.flecha span{display:block;width:10px;height:10px;border-top:2px solid #fff;border-right:2px solid #fff}
.izq span{transform:rotate(-135deg)}.der span{transform:rotate(45deg)}
@media(max-width:600px){.fija{width:126px;padding:0 8px}.fija strong{font-size:12px}.zona{left:126px}.scroll{padding-left:22px}.item{padding:0 14px;font-size:12px;gap:6px}.item .cons{font-size:10px}.flecha{width:38px}}
</style>
</head>
<body>
<div class="marquesina" aria-label="Próximos remates">
  <div class="fija"><strong>Remates en<br>Entre Ríos</strong></div>
  <div class="zona">
    <div id="izq" class="flecha izq" aria-label="Anterior"><span></span></div>
    <div id="scroll" class="scroll" aria-label="Deslizá para ver las próximas fechas">
      <div class="item"><span>Cargando remates…</span></div>
    </div>
    <div id="der" class="flecha der" aria-label="Siguiente"><span></span></div>
  </div>
</div>
<script>
const JSON_URL='https://raw.githubusercontent.com/acciondelarroque-creator/remates-entre-rios/main/remates.json';
const MESES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const scroll=document.getElementById('scroll'),izq=document.getElementById('izq'),der=document.getElementById('der');
function ordenar(a){return [...a].sort((x,y)=>(x.fecha||'').localeCompare(y.fecha||'')||(x.hora||'').localeCompare(y.hora||'')||(x.localidad||'').localeCompare(y.localidad||'','es')||(x.consignataria||'').localeCompare(y.consignataria||'','es'))}
function fecha(r){const d=new Date((r.fecha||'')+'T'+(r.hora||'00:00'));if(Number.isNaN(d.getTime()))return r.fecha||'';return `${String(d.getDate()).padStart(2,'0')} ${MESES[d.getMonth()]}${r.hora?' · '+r.hora:''}`}
function flechas(){const ok=scroll.scrollWidth>scroll.clientWidth+2;izq.style.display=ok?'flex':'none';der.style.display=ok?'flex':'none'}
function mover(n){scroll.scrollBy({left:n*Math.max(260,scroll.clientWidth*.72),behavior:'smooth'})}
der.addEventListener('click',()=>{pausarHasta=Date.now()+2500;mover(1)});izq.addEventListener('click',()=>{pausarHasta=Date.now()+2500;mover(-1)});
let arrastrando=false,inicioX=0,inicioScroll=0,pausarHasta=0,autoDireccion=1;
scroll.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;arrastrando=true;inicioX=e.clientX;inicioScroll=scroll.scrollLeft;pausarHasta=Date.now()+2500;scroll.classList.add('grabbing');e.preventDefault()});
window.addEventListener('pointermove',e=>{if(!arrastrando)return;scroll.scrollLeft=inicioScroll-(e.clientX-inicioX);e.preventDefault()});
window.addEventListener('pointerup',()=>{arrastrando=false;scroll.classList.remove('grabbing')});
scroll.addEventListener('mouseenter',()=>{pausarHasta=Date.now()+999999999});
scroll.addEventListener('mouseleave',()=>{pausarHasta=Date.now()+1200});
function desplazamientoAutomatico(){
 if(arrastrando||Date.now()<pausarHasta)return;
 const max=scroll.scrollWidth-scroll.clientWidth;
 if(max<=2)return;
 let next=scroll.scrollLeft+(0.35*autoDireccion);
 if(next>=max){next=max;autoDireccion=-1}
 if(next<=0){next=0;autoDireccion=1}
 scroll.scrollLeft=next;
}
setInterval(desplazamientoAutomatico,30);
async function cargar(){
 try{
  const r=await fetch(JSON_URL+'?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const datos=await r.json();
  const remates=ordenar(datos.remates||[]);
  if(!remates.length){scroll.innerHTML='<div class="item"><span>Sin fechas de remates</span></div>';flechas();return}
  scroll.innerHTML=remates.map(r=>`<div class="item"><span class="fecha">${fecha(r)}</span><span class="lugar">${r.localidad||'Sin localidad'}</span><span class="cons">${r.consignataria||'Sin consignataria'}</span></div>`).join('');
  requestAnimationFrame(flechas);
 }catch(e){scroll.innerHTML='<div class="item"><span>No se pudieron cargar los remates</span></div>';flechas()}
}
scroll.addEventListener('scroll',flechas);window.addEventListener('resize',flechas);cargar();setInterval(cargar,300000);
</script>
</body>
</html>

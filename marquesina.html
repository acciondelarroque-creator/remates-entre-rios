<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Marquesina de remates</title><style>html,body{margin:0;padding:0;width:100%;overflow:hidden}.marquesina{width:100%;height:45px;overflow:hidden;background:#f4b942;color:#16231e;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700;white-space:nowrap;display:flex;align-items:center}.marquesina__texto{display:inline-block;padding:10px 0}.marquesina__texto.cargando{width:100%;text-align:center;animation:none}.marquesina__texto.activo{min-width:100%;animation:desplazar 60s linear infinite}@keyframes desplazar{from{transform:translateX(100%)}to{transform:translateX(-100%)}}@media(prefers-reduced-motion:reduce){.marquesina__texto.activo{animation:none;padding-left:10px}}</style></head><body><section class="marquesina" aria-label="Próximos remates"><div id="marquesina" class="marquesina__texto cargando">Fechas de remates de Entre Ríos</div></section><script>const ARCHIVO="https://raw.githubusercontent.com/acciondelarroque-creator/remates-entre-rios/main/remates.json";const elemento=document.querySelector("#marquesina");const texto=v=>v||"Sin información";const fechaLegible=(fecha,hora)=>{const valor=new Date(fecha+"T"+(hora||"00:00"));return Number.isNaN(valor)?[fecha,hora].filter(Boolean).join(" · "):new Intl.DateTimeFormat("es-AR",{weekday:"short",day:"2-digit",month:"long",hour:hora?"2-digit":undefined,minute:hora?"2-digit":undefined}).format(valor).replace(","," ·")};async function actualizar(){try{const respuesta=await fetch(`${ARCHIVO}?v=${Date.now()}`,{cache:"no-store"});if(!respuesta.ok)throw new Error();const datos=await respuesta.json();const remates=[...(datos.remates||[])].sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")||(a.hora||"").localeCompare(b.hora||""));elemento.textContent=remates.length?remates.map(r=>`${fechaLegible(r.fecha,r.hora)} · ${texto(r.localidad)} · ${texto(r.consignataria)}`).join("   •   "):"No hay próximos remates informados por el momento.";elemento.classList.remove("cargando");elemento.classList.add("activo")}catch(error){}}actualizar();setInterval(actualizar,5*60*1000);</script></body></html>

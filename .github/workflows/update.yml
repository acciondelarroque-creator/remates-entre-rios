name: Actualizar remates de Entre Ríos

on:
  push:
    branches: [main]
  schedule:
    # 14:20 ART (17:20 UTC), después de la actualización diaria de la fuente.
    - cron: "20 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Obtener remates
        run: python update.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remates.json
          git diff --cached --quiet || git commit -m "Actualizar remates de Entre Ríos"
          git push
